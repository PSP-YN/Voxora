name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest numpy==1.26.4 scipy
      - name: Compile application and worker
        run: python -m py_compile native_app.py native_backend.py download_models.py qt_app/main.py model_adapters/*.py
      - name: Run backend and adapter tests
        env:
          PYTHONPATH: .
        run: pytest -q --ignore=tests/test_qt_ui.py
      - name: Check installer syntax
        run: bash -n install.sh run.sh uninstall.sh
