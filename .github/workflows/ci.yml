name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Compile application and worker
        run: python -m py_compile native_app.py native_backend.py download_models.py
      - name: Run backend validation tests
        run: pytest -q
      - name: Check installer syntax
        run: bash -n install.sh run.sh uninstall.sh
