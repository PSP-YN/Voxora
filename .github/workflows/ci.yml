name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libasound2t64
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest numpy==1.26.4 scipy -r requirements-qt.txt
      - name: Compile application and worker
        run: python -m py_compile native_app.py native_backend.py download_models.py
      - name: Run backend and Qt UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: pytest -q
      - name: Check installer syntax
        run: bash -n install.sh run.sh uninstall.sh
