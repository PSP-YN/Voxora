name: Release source bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create clean source archive
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-manual}"
          git archive --format=tar.gz --prefix="Voxora-${VERSION}/" HEAD > "dist/Voxora-${VERSION}-linux-source.tar.gz"
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxora-linux-source
          path: dist/*
